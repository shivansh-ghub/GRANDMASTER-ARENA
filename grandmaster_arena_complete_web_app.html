<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Arena - Chess Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        chess: {
                            light: '#eeeed2',
                            dark: '#769656',
                            highlight: '#baca44',
                            border: '#262421',
                            panel: '#262522',
                            darkpanel: '#1e1d1b'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', '-apple-system', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-deep: #161512;
            --panel-bg: #262421;
            --panel-header: #1e1c18;
            --sq-light: #eeeed2;
            --sq-dark: #769656;
            --sq-select: #f5f682;
            --sq-last: #bbcb2b;
        }

        body {
            background-color: var(--bg-deep);
            color: #bababa;
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            min-height: 100vh;
        }

        .chess-panel {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .board-container {
            position: relative;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            border-radius: 6px;
            overflow: hidden;
        }

        .chess-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            height: 100%;
            touch-action: manipulation;
        }

        .square {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.1s ease;
        }

        .square.light { background-color: var(--sq-light); color: #769656; }
        .square.dark { background-color: var(--sq-dark); color: #eeeed2; }

        .square.selected {
            background-color: var(--sq-select) !important;
        }

        .square.highlight-last {
            background-color: var(--sq-last) !important;
        }

        .square.hint-move::after {
            content: '';
            width: 28%;
            height: 28%;
            background: rgba(0, 0, 0, 0.18);
            border-radius: 50%;
            pointer-events: none;
        }

        .square.hint-capture::after {
            content: '';
            position: absolute;
            inset: 0;
            border: 6px solid rgba(0, 0, 0, 0.18);
            border-radius: 50%;
            pointer-events: none;
        }

        .square.in-check {
            background-color: #e74c3c !important;
            box-shadow: inset 0 0 12px #900;
        }

        .piece {
            width: 92%;
            height: 92%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 10;
            cursor: pointer;
            transition: transform 0.05s ease-out;
        }

        .square-coord {
            position: absolute;
            font-size: 11px;
            font-weight: 700;
            pointer-events: none;
            line-height: 1;
        }
        .coord-file { bottom: 2px; right: 4px; }
        .coord-rank { top: 2px; left: 4px; }

        .eval-bar-container {
            width: 18px;
            height: 100%;
            background: #272522;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .eval-bar-fill {
            width: 100%;
            background: #ffffff;
            transition: height 0.4s ease-out;
        }
        .eval-score-text {
            position: absolute;
            width: 100%;
            text-align: center;
            font-size: 9px;
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
            z-index: 20;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e1c18;
        }
        ::-webkit-scrollbar-thumb {
            background: #3c3934;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #524e47;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen bg-[#161512]">

    <header class="bg-[#1e1c18] border-b border-[#2b2925] px-4 py-2.5 flex items-center justify-between z-30">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-lg bg-[#81b64c] flex items-center justify-center text-white shadow-md">
                <i class="fa-solid fa-chess-pawn text-xl"></i>
            </div>
            <div>
                <span class="text-base font-extrabold text-white tracking-tight">
                    Grandmaster<span class="text-[#81b64c]">Arena</span>
                </span>
                <span class="text-[10px] ml-2 px-1.5 py-0.5 rounded bg-[#2b2925] text-slate-400 font-mono font-bold uppercase">Pro</span>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <div class="flex items-center bg-[#161512] p-1 rounded-lg border border-white/5 space-x-1">
                <button onclick="setTheme('classic')" class="w-4 h-4 rounded-full bg-[#769656] border border-white/20 hover:scale-110 transition" title="Green Classic"></button>
                <button onclick="setTheme('wood')" class="w-4 h-4 rounded-full bg-[#b58863] border border-white/20 hover:scale-110 transition" title="Wood Oak"></button>
                <button onclick="setTheme('ocean')" class="w-4 h-4 rounded-full bg-[#4b7399] border border-white/20 hover:scale-110 transition" title="Ocean Blue"></button>
                <button onclick="setTheme('dark')" class="w-4 h-4 rounded-full bg-[#525252] border border-white/20 hover:scale-110 transition" title="Midnight Dark"></button>
            </div>

            <button id="toggleSoundBtn" class="bg-[#262421] hover:bg-[#322f2b] text-slate-300 p-1.5 rounded-lg text-xs border border-white/5 transition flex items-center justify-center">
                <i id="soundIcon" class="fa-solid fa-volume-high w-4 text-center"></i>
            </button>
        </div>
    </header>

    <div class="flex-1 max-w-6xl w-full mx-auto p-2 sm:p-4 md:p-6 flex flex-col lg:flex-row gap-5 items-start">
        
        <!-- LEFT COLUMN: BOARD & PLAYERS -->
        <div class="flex-1 w-full flex flex-col items-center">
            
            <!-- OPPONENT PLAYER BAR -->
            <div class="w-full max-w-[560px] bg-[#21201d] px-3 py-2 rounded-t-lg border border-[#2b2925] flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="relative">
                        <div class="w-9 h-9 rounded bg-[#2b2925] flex items-center justify-center text-slate-300 font-bold">
                            <i id="blackAvatarIcon" class="fa-solid fa-robot text-lg"></i>
                        </div>
                        <span id="blackActiveDot" class="absolute -top-0.5 -right-0.5 w-2.5 h-2.5 bg-emerald-500 rounded-full border border-[#21201d]"></span>
                    </div>
                    <div>
                        <div class="flex items-center gap-1.5">
                            <span id="blackPlayerName" class="font-bold text-xs text-white">Bot (1200)</span>
                            <span id="blackEloBadge" class="text-[10px] font-mono text-slate-400 bg-[#161512] px-1.5 py-0.2 rounded">1200</span>
                        </div>
                        <p id="blackStatus" class="text-[10px] text-slate-400">Engine Ready</p>
                    </div>
                </div>
                <div id="blackClock" class="bg-[#161512] px-3.5 py-1 rounded text-base font-mono font-bold text-white border border-white/5">
                    10:00
                </div>
            </div>

            <!-- BOARD & EVALUATION BAR ROW -->
            <div class="w-full max-w-[560px] flex items-stretch gap-2.5 my-1">
                <!-- Evaluation Gauge Bar -->
                <div class="eval-bar-container">
                    <span id="evalScoreText" class="eval-score-text text-black top-1">+0.0</span>
                    <div id="evalBarFill" class="eval-bar-fill" style="height: 50%;"></div>
                </div>

                <!-- Interactive Chessboard -->
                <div class="flex-1 aspect-square board-container">
                    <div id="chessBoardContainer" class="chess-grid"></div>

                    <!-- GameOver Overlay Card -->
                    <div id="gameStatusOverlay" class="hidden absolute inset-0 bg-black/80 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center z-30">
                        <i id="overlayIcon" class="fa-solid fa-trophy text-amber-400 text-4xl mb-2"></i>
                        <h2 id="overlayTitle" class="text-2xl font-black text-white mb-1">Checkmate</h2>
                        <p id="overlayMessage" class="text-slate-300 text-xs mb-5">White win by resignation.</p>
                        <button id="newGameBtn" class="bg-[#81b64c] hover:bg-[#a3d168] text-white font-bold px-6 py-2 rounded-lg text-xs uppercase tracking-wider transition shadow-lg">
                            New Game
                        </button>
                    </div>
                </div>
            </div>

            <!-- PLAYER BAR -->
            <div class="w-full max-w-[560px] bg-[#21201d] px-3 py-2 rounded-b-lg border border-[#2b2925] flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="relative">
                        <div class="w-9 h-9 rounded bg-[#81b64c] flex items-center justify-center text-white font-bold">
                            <i class="fa-solid fa-user text-base"></i>
                        </div>
                        <span id="whiteActiveDot" class="absolute -top-0.5 -right-0.5 w-2.5 h-2.5 bg-emerald-500 rounded-full border border-[#21201d]"></span>
                    </div>
                    <div>
                        <div id="whitePlayerName" class="font-bold text-xs text-white">You (White)</div>
                        <p id="whiteStatus" class="text-[10px] text-[#81b64c] font-semibold">Your Turn</p>
                    </div>
                </div>
                <div id="whiteClock" class="bg-[#161512] px-3.5 py-1 rounded text-base font-mono font-bold text-white border border-white/5">
                    10:00
                </div>
            </div>

            <!-- BOTTOM CONTROL BUTTONS -->
            <div class="w-full max-w-[560px] mt-3 grid grid-cols-4 gap-2">
                <button id="undoBtn" class="bg-[#262421] hover:bg-[#322f2b] text-slate-200 py-2 px-2 rounded text-xs font-semibold border border-white/5 transition flex items-center justify-center space-x-1">
                    <i class="fa-solid fa-rotate-left text-slate-400"></i>
                    <span>Undo</span>
                </button>
                <button id="flipBoardBtn" class="bg-[#262421] hover:bg-[#322f2b] text-slate-200 py-2 px-2 rounded text-xs font-semibold border border-white/5 transition flex items-center justify-center space-x-1">
                    <i class="fa-solid fa-arrows-rotate text-slate-400"></i>
                    <span>Flip</span>
                </button>
                <button id="resetBoardBtn" class="bg-[#262421] hover:bg-[#322f2b] text-slate-200 py-2 px-2 rounded text-xs font-semibold border border-white/5 transition flex items-center justify-center space-x-1">
                    <i class="fa-solid fa-arrows-spin text-slate-400"></i>
                    <span>Restart</span>
                </button>
                <button id="startPassPlayBtn" class="bg-[#262421] hover:bg-[#322f2b] text-slate-200 py-2 px-2 rounded text-xs font-semibold border border-white/5 transition flex items-center justify-center space-x-1">
                    <i class="fa-solid fa-users text-slate-400"></i>
                    <span>2-Player</span>
                </button>
            </div>
        </div>

        <!-- RIGHT SIDE PANEL -->
        <div class="w-full lg:w-96 chess-panel rounded-lg p-4 flex flex-col h-[560px]">
            
            <!-- TABS -->
            <div class="flex space-x-1 bg-[#1e1c18] p-1 rounded mb-3 border border-white/5">
                <button id="tabLobbyBtn" class="flex-1 py-1.5 rounded text-xs font-bold text-white bg-[#262421] border border-white/10 transition">
                    Play vs AI
                </button>
                <button id="tabChatBtn" class="flex-1 py-1.5 rounded text-xs font-semibold text-slate-400 hover:text-white transition">
                    Move Log
                </button>
                <button id="tabReviewBtn" class="flex-1 py-1.5 rounded text-xs font-semibold text-slate-400 hover:text-white transition">
                    Analytics
                </button>
            </div>

            <!-- TAB 1: SETUP & LOBBY -->
            <div id="lobbyTab" class="flex-1 flex flex-col min-h-0 space-y-3">
                
                <div class="bg-[#1e1c18] p-3 rounded border border-white/5 space-y-2">
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-bold text-slate-300"><i class="fa-solid fa-robot text-[#81b64c] mr-1"></i> Bot Rating</span>
                        <span id="activeEloLabel" class="text-xs font-mono font-bold text-[#81b64c]">1200 ELO</span>
                    </div>
                    <select id="quickEloSelect" class="w-full bg-[#161512] border border-white/10 rounded px-2.5 py-1.5 text-xs text-slate-200 font-semibold focus:outline-none focus:border-[#81b64c]">
                        <option value="100">100 ELO - Novice Pawn</option>
                        <option value="500">500 ELO - Blunder Bot</option>
                        <option value="1000">1000 ELO - Club Beginner</option>
                        <option value="1200" selected>1200 ELO - Intermediate Strategist</option>
                        <option value="1500">1500 ELO - Tactical Mastermind</option>
                        <option value="1800">1800 ELO - Advanced Competitor</option>
                        <option value="2200">2200 ELO - Senior Master AI</option>
                        <option value="2500">2500 ELO - Grandmaster Titan</option>
                    </select>
                    
                    <div class="flex items-center justify-between pt-1">
                        <span class="text-xs font-bold text-slate-300">Play As</span>
                        <div class="flex space-x-2">
                            <button id="playWhiteBtn" onclick="setPlayerSide('w')" class="px-3 py-1 bg-[#81b64c] text-white rounded text-xs font-bold">White</button>
                            <button id="playBlackBtn" onclick="setPlayerSide('b')" class="px-3 py-1 bg-[#262421] text-slate-400 rounded text-xs font-bold border border-white/5">Black</button>
                        </div>
                    </div>
                </div>

                <!-- Time Controls -->
                <div class="bg-[#1e1c18] p-3 rounded border border-white/5 space-y-1.5">
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-bold text-slate-300"><i class="fa-solid fa-stopwatch text-[#81b64c] mr-1"></i> Time Control</span>
                        <span id="activeTimeControlLabel" class="text-xs font-mono font-bold text-slate-300">10 min</span>
                    </div>
                    <select id="timeControlSelect" class="w-full bg-[#161512] border border-white/10 rounded px-2.5 py-1.5 text-xs text-slate-200 font-semibold focus:outline-none focus:border-[#81b64c]">
                        <option value="1|0">1 min (Bullet)</option>
                        <option value="1|2">1 + 2 sec (Bullet)</option>
                        <option value="1|5">1 + 5 sec (Bullet)</option>
                        <option value="3|0">3 min (Blitz)</option>
                        <option value="3|2">3 + 2 sec (Blitz)</option>
                        <option value="5|0">5 min (Standard Blitz)</option>
                        <option value="10|0" selected>10 min (Rapid)</option>
                        <option value="10|15">10 + 15 sec (Rapid)</option>
                        <option value="30|0">30 min (Classical)</option>
                    </select>
                </div>

                <button id="startAiBtn" class="w-full bg-[#81b64c] hover:bg-[#a3d168] text-white font-bold py-2.5 rounded text-xs uppercase tracking-wider transition shadow-lg flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-play"></i>
                    <span>Start New Match</span>
                </button>

                <!-- Move History -->
                <div class="flex-1 flex flex-col min-h-0 bg-[#1e1c18] border border-white/5 rounded p-2">
                    <div class="flex items-center justify-between pb-1.5 border-b border-white/5 mb-1.5">
                        <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Moves</span>
                        <span id="moveCountBadge" class="text-[10px] text-slate-400 font-mono">0 moves</span>
                    </div>
                    <div id="moveLog" class="flex-1 overflow-y-auto space-y-1 text-xs font-mono pr-1">
                        <div class="text-center py-6 text-slate-500 italic">Select piece on board to move</div>
                    </div>
                </div>
            </div>

            <!-- TAB 2: CHAT / FEN LOG -->
            <div id="chatTab" class="hidden flex-1 flex flex-col min-h-0">
                <div id="chatMessages" class="flex-1 overflow-y-auto space-y-1.5 p-2 bg-[#1e1c18] border border-white/5 rounded mb-2 text-xs font-mono text-slate-300">
                    <div class="text-[#81b64c]">[System]: Grandmaster Arena initialized.</div>
                </div>
                <div class="space-y-1.5">
                    <input type="text" id="fenInput" placeholder="Enter FEN string..." class="w-full bg-[#161512] border border-white/10 rounded px-2 py-1 text-xs text-slate-200 font-mono focus:outline-none focus:border-[#81b64c]">
                    <div class="flex space-x-1.5">
                        <button onclick="loadFEN()" class="flex-1 bg-[#262421] hover:bg-[#322f2b] text-white py-1 rounded text-xs font-semibold border border-white/5">Load FEN</button>
                        <button onclick="copyFEN()" class="flex-1 bg-[#262421] hover:bg-[#322f2b] text-white py-1 rounded text-xs font-semibold border border-white/5">Copy FEN</button>
                    </div>
                </div>
            </div>

            <!-- TAB 3: REVIEW / GRAPH -->
            <div id="reviewTab" class="hidden flex-1 flex flex-col min-h-0">
                <div class="bg-[#1e1c18] p-3 rounded border border-white/5 flex-1 flex flex-col">
                    <h4 class="text-xs font-bold text-white mb-2">Evaluation Graph</h4>
                    <div class="flex-1 w-full min-h-0">
                        <canvas id="evalChart"></canvas>
                    </div>
                </div>
            </div>

        </div>
    </div>

            'bp': 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45"><path d="M 22.5 9 C 19.8 9 17.6 11.2 17.6 13.9 C 17.6 15.4 18.3 16.7 19.4 17.6 C 17.5 18.8 16.3 20.9 16.3 23.3 C 16.3 24.1 16.5 24.9 16.8 25.6 C 14.3 26.9 12.5 29.5 12.5 32.5 L 32.5 32.5 C 32.5 29.5 30.7 26.9 28.2 25.6 C 28.5 24.9 28.7 24.1 28.7 23.3 C 28.7 20.9 27.5 18.8 25.6 17.6 C 26.7 16.7 27.4 15.4 27.4 13.9 C 27.4 11.2 25.2 9 22.5 9 Z" fill="%232b2925" stroke="%23ffffff" stroke-width="1.5"/><path d="M 12.5 32.5 L 32.5 32.5 L 32.5 36 L 12.5 36 Z" fill="%232b2925" stroke="%23ffffff" stroke-width="1.5"/></svg>',
            'br': 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45"><g fill="%232b2925" stroke="%23ffffff" stroke-width="1.5"><path d="M 9 39 L 36 39 L 36 36 L 9 36 Z"/><path d="M 12 36 L 12 32 L 33 32 L 33 36 Z"/><path d="M 11 14 L 11 9 L 15 9 L 15 11 L 20 11 L 20 9 L 25 9 L 25 11 L 30 11 L 30 9 L 34 9 L 34 14 Z"/><path d="M 12 14 L 33 14 L 31 32 L 14 32 Z"/></g></svg>',
            'bn': 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45"><path d="M 22 10 C 10.5 11 1.5 23 10 38 L 35 38 C 35 38 32 32 30 22 C 30 22 28 12 22 10 Z" fill="%232b2925" stroke="%23ffffff" stroke-width="1.5"/><path d="M 22 10 C 32.5 11 38.5 18 31 29 C 39 26 37 18 37 18 C 37 18 34 22 30 22 C 34.5 13 25 8 22 10 Z" fill="%232b2925" stroke="%23ffffff" stroke-width="1.5"/><circle cx="15" cy="16" r="1.5" fill="%23ffffff"/></svg>',
            'bb': 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45"><g fill="%232b2925" stroke="%23ffffff" stroke-width="1.5"><path d="M 9 36 C 12.39 35.03 19.11 36.37 22.5 34 C 25.89 36.37 32.61 35.03 36 36 C 36 36 37.65 36.54 39 38 C 38.32 38.97 37.35 38.99 36 38.5 C 32.61 37.53 25.89 38.87 22.5 36.5 C 19.11 38.87 12.39 37.53 9 38.5 C 7.64 38.99 6.67 38.97 6 38 C 7.34 36.54 9 36 9 36 Z"/><path d="M 15 32 C 17.5 34.5 27.5 34.5 30 32 C 30.5 30.5 30 22 30 22 C 30 14 25 8.5 22.5 8.5 C 20 8.5 15 14 15 22 C 15 22 14.5 30.5 15 32 Z"/><circle cx="22.5" cy="5.5" r="2.5"/></g></svg>',
            'bq': 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45"><g fill="%232b2925" stroke="%23ffffff" stroke-width="1.5"><path d="M 9 26 C 17.5 24.5 30 24.5 36 26 L 38 14 L 31 22 L 22.5 10 L 14 22 L 7 14 Z"/><path d="M 9 26 C 9 28 10.5 28 11.5 30 C 12.5 32 12.5 34.5 12 36 L 33 36 C 32.5 34.5 32.5 32 33.5 30 C 34.5 28 36 28 36 26 Z"/><circle cx="6" cy="12" r="2"/><circle cx="14" cy="9" r="2"/><circle cx="22.5" cy="6" r="2"/><circle cx="31" cy="9" r="2"/><circle cx="39" cy="12" r="2"/></g></svg>',
            'bk': 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45"><g fill="%232b2925" stroke="%23ffffff" stroke-width="1.5"><path d="M 22.5 11.63 L 22.5 6 M 20 8 L 25 8"/><path d="M 22.5 25 C 22.5 25 27 17.5 27 14.5 C 27 12 25 10 22.5 10 C 20 10 18 12 18 14.5 C 18 17.5 22.5 25 22.5 25 Z"/><path d="M 11.5 37 C 17 35.5 28 35.5 33.5 37 C 34.5 30 31.5 21 22.5 21 C 13.5 21 10.5 30 11.5 37 Z"/></g></svg>'
        };

        let game = new Chess();
        let selectedSquare = null;
        let isFlipped = false;
        let gameMode = 'ai';
        let currentElo = 1200;
        let whiteTime = 600;
        let blackTime = 600;
        let timeIncrement = 0;
        let timerInterval = null;
        let historyMoves = [];
        let evalHistory = [0];
        let evalChart = null;
        let playerColor = 'w';
        let soundEnabled = true;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (!soundEnabled) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;
                if (type === 'move') {
                    osc.frequency.setValueAtTime(400, now);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'capture') {
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(300, now + 0.12);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'check') {
                    osc.frequency.setValueAtTime(600, now);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                }
            } catch (e) {}
        }

        function setTheme(theme) {
            const root = document.documentElement;
            if (theme === 'wood') {
                root.style.setProperty('--sq-light', '#f0d9b5');
                root.style.setProperty('--sq-dark', '#b58863');
            } else if (theme === 'ocean') {
                root.style.setProperty('--sq-light', '#dee3e6');
                root.style.setProperty('--sq-dark', '#4b7399');
            } else if (theme === 'dark') {
                root.style.setProperty('--sq-light', '#404040');
                root.style.setProperty('--sq-dark', '#262626');
            } else {
                root.style.setProperty('--sq-light', '#eeeed2');
                root.style.setProperty('--sq-dark', '#769656');
            }
            renderBoard();
        }

        function setPlayerSide(color) {
            playerColor = color;
            isFlipped = (color === 'b');
            document.getElementById('playWhiteBtn').className = color === 'w' ? 'px-3 py-1 bg-[#81b64c] text-white rounded text-xs font-bold' : 'px-3 py-1 bg-[#262421] text-slate-400 rounded text-xs font-bold border border-white/5';
            document.getElementById('playBlackBtn').className = color === 'b' ? 'px-3 py-1 bg-[#81b64c] text-white rounded text-xs font-bold' : 'px-3 py-1 bg-[#262421] text-slate-400 rounded text-xs font-bold border border-white/5';
            resetGame();
        }

        function renderBoard() {
            const container = document.getElementById('chessBoardContainer');
            if (!container) return;
            container.innerHTML = '';

            const board = game.board();
            const lastMove = historyMoves.length > 0 ? historyMoves[historyMoves.length - 1] : null;

            let inCheckSquare = null;
            if (game.in_check()) {
                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) {
                        const p = board[r][c];
                        if (p && p.type === 'k' && p.color === game.turn()) {
                            inCheckSquare = String.fromCharCode(97 + c) + (8 - r);
                        }
                    }
                }
            }

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const row = isFlipped ? 7 - r : r;
                    const col = isFlipped ? 7 - c : c;
                    
                    const squareName = String.fromCharCode(97 + col) + (8 - row);
                    const isLight = (row + col) % 2 === 0;
                    
                    const squareEl = document.createElement('div');
                    squareEl.className = `square ${isLight ? 'light' : 'dark'}`;
                    squareEl.dataset.square = squareName;

                    if (selectedSquare === squareName) {
                        squareEl.classList.add('selected');
                    } else if (lastMove && (lastMove.from === squareName || lastMove.to === squareName)) {
                        squareEl.classList.add('highlight-last');
                    }

                    if (inCheckSquare === squareName) {
                        squareEl.classList.add('in-check');
                    }

                    if (selectedSquare) {
                        const moves = game.moves({ square: selectedSquare, verbose: true });
                        const targetMove = moves.find(m => m.to === squareName);
                        if (targetMove) {
                            if (targetMove.captured) {
                                squareEl.classList.add('hint-capture');
                            } else {
                                squareEl.classList.add('hint-move');
                            }
                        }
                    }

                    if (col === (isFlipped ? 7 : 0)) {
                        const rankLabel = document.createElement('span');
                        rankLabel.className = 'square-coord coord-rank';
                        rankLabel.textContent = 8 - row;
                        squareEl.appendChild(rankLabel);
                    }
                    if (row === (isFlipped ? 0 : 7)) {
                        const fileLabel = document.createElement('span');
                        fileLabel.className = 'square-coord coord-file';
                        fileLabel.textContent = String.fromCharCode(97 + col);
                        squareEl.appendChild(fileLabel);
                    }

                    const piece = board[row][col];
                    if (piece) {
                        const pieceEl = document.createElement('div');
                        pieceEl.className = 'piece';
                        const pieceKey = piece.color + piece.type;
                        pieceEl.style.backgroundImage = `url('${PIECE_IMAGES[pieceKey]}')`;
                        squareEl.appendChild(pieceEl);
                    }

                    const handleTouchOrClick = (e) => {
                        e.preventDefault();
                        onSquareClick(squareName);
                    };

                    squareEl.addEventListener('touchstart', handleTouchOrClick, { passive: false });
                    squareEl.addEventListener('click', (e) => {
                        if (e.detail !== 0) onSquareClick(squareName);
                    });

                    container.appendChild(squareEl);
                }
            }
        }

        function onSquareClick(square) {
            if (game.game_over()) return;
            if (gameMode === 'ai' && game.turn() !== playerColor) return;

            if (selectedSquare === square) {
                selectedSquare = null;
                renderBoard();
                return;
            }

            if (selectedSquare) {
                const move = game.move({
                    from: selectedSquare,
                    to: square,
                    promotion: 'q'
                });

                if (move) {
                    selectedSquare = null;
                    onMoveMade(move);
                    renderBoard();

                    if (gameMode === 'ai' && !game.game_over()) {
                        setTimeout(makeAiMove, 300);
                    }
                    return;
                }
            }

            const piece = game.get(square);
            if (piece && piece.color === game.turn()) {
                selectedSquare = square;
                renderBoard();
            } else {
                selectedSquare = null;
                renderBoard();
            }
        }

        function onMoveMade(move) {
            historyMoves.push(move);
            updateMoveLog();
            startTimer();

            if (move.captured) {
                playSound('capture');
            } else if (game.in_check()) {
                playSound('check');
            } else {
                playSound('move');
            }

            if (move.color === 'w') whiteTime += timeIncrement;
            else blackTime += timeIncrement;
            
            updateTimerDisplay();
            updateEvalBar();

            if (game.game_over()) {
                stopTimer();
                checkGameOver();
            }
        }

        function undoMove() {
            if (historyMoves.length === 0) return;
            if (gameMode === 'ai') {
                game.undo();
                historyMoves.pop();
                if (historyMoves.length > 0 && game.turn() !== playerColor) {
                    game.undo();
                    historyMoves.pop();
                }
            } else {
                game.undo();
                historyMoves.pop();
            }
            selectedSquare = null;
            updateMoveLog();
            updateEvalBar();
            renderBoard();
        }

        function updateMoveLog() {
            const log = document.getElementById('moveLog');
            if (!log) return;

            const moves = game.history({ verbose: true });
            let html = '';
            for (let i = 0; i < moves.length; i += 2) {
                const moveNum = Math.floor(i / 2) + 1;
                const whiteMove = moves[i].san;
                const blackMove = moves[i + 1] ? moves[i + 1].san : '';
                html += `<div class="flex py-1 border-b border-white/5"><span class="w-8 text-slate-500 font-bold">${moveNum}.</span><span class="w-20 text-white font-semibold">${whiteMove}</span><span class="w-20 text-slate-400">${blackMove}</span></div>`;
            }
            log.innerHTML = html || '<div class="text-center py-6 text-slate-500 italic">Select piece on board to move</div>';
            log.scrollTop = log.scrollHeight;

            const badge = document.getElementById('moveCountBadge');
            if (badge) badge.textContent = `${moves.length} moves`;
        }

        function makeAiMove() {
            if (game.game_over()) return;
            const possibleMoves = game.moves({ verbose: true });
            if (possibleMoves.length === 0) return;

            possibleMoves.sort(() => Math.random() - 0.5);

            let chosenMove = possibleMoves[0];
            if (currentElo > 500) {
                let maxEval = -9999;
                for (let m of possibleMoves) {
                    game.move(m);
                    let score = -evaluateBoard();
                    game.undo();
                    if (score > maxEval) {
                        maxEval = score;
                        chosenMove = m;
                    }
                }
            }

            const move = game.move(chosenMove);
            if (move) {
                onMoveMade(move);
                renderBoard();
            }
        }

        function evaluateBoard() {
            const weights = { p: 10, n: 30, b: 30, r: 50, q: 90, k: 900 };
            let total = 0;
            const board = game.board();

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const p = board[r][c];
                    if (p) {
                        const val = weights[p.type] || 0;
                        total += p.color === 'w' ? val : -val;
                    }
                }
            }
            return total;
        }

        function updateEvalBar() {
            const score = evaluateBoard();
            const evalFill = document.getElementById('evalBarFill');
            const evalText = document.getElementById('evalScoreText');
            if (!evalFill || !evalText) return;

            let num = (score / 10).toFixed(1);
            evalText.textContent = num > 0 ? `+${num}` : num;

            let percent = 50 + (score / 20) * 50;
            percent = Math.max(5, Math.min(95, percent));
            evalFill.style.height = `${percent}%`;

            evalHistory.push(score);
            updateEvalChart();
        }

        function applyTimeControl() {
            const val = document.getElementById('timeControlSelect').value;
            const parts = val.split('|');
            const mins = parseInt(parts[0]);
            timeIncrement = parseInt(parts[1] || 0);

            whiteTime = mins * 60;
            blackTime = mins * 60;
            
            const incStr = timeIncrement > 0 ? ` + ${timeIncrement}s` : '';
            document.getElementById('activeTimeControlLabel').textContent = `${mins} min${incStr}`;
            updateTimerDisplay();
        }

        function startTimer() {
            if (timerInterval) return;
            timerInterval = setInterval(() => {
                if (game.turn() === 'w') {
                    whiteTime--;
                    if (whiteTime <= 0) endGameByTimeout('Black');
                } else {
                    blackTime--;
                    if (blackTime <= 0) endGameByTimeout('White');
                }
                updateTimerDisplay();
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function updateTimerDisplay() {
            const formatTime = (s) => {
                const mins = Math.floor(Math.max(0, s) / 60);
                const secs = Math.max(0, s) % 60;
                return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            };
            document.getElementById('whiteClock').textContent = formatTime(whiteTime);
            document.getElementById('blackClock').textContent = formatTime(blackTime);
        }

        function endGameByTimeout(winner) {
            stopTimer();
            showGameOver(`${winner} Victory`, 'Opponent clock expired.');
        }

        function checkGameOver() {
            if (game.in_checkmate()) {
                const winner = game.turn() === 'w' ? 'Black' : 'White';
                showGameOver('Checkmate', `${winner} claims victory.`);
            } else if (game.in_draw()) {
                showGameOver('Stalemate Draw', 'Neither player could reach mate.');
            }
        }

        function showGameOver(title, msg) {
            const overlay = document.getElementById('gameStatusOverlay');
            document.getElementById('overlayTitle').textContent = title;
            document.getElementById('overlayMessage').textContent = msg;
            overlay.classList.remove('hidden');
        }

        function resetGame() {
            game.reset();
            selectedSquare = null;
            historyMoves = [];
            evalHistory = [0];
            stopTimer();
            applyTimeControl();
            updateMoveLog();
            updateEvalBar();
            document.getElementById('gameStatusOverlay').classList.add('hidden');
            renderBoard();

            if (gameMode === 'ai' && playerColor === 'b') {
                setTimeout(makeAiMove, 400);
            }
        }

        function loadFEN() {
            const input = document.getElementById('fenInput').value.trim();
            if (input && game.load(input)) {
                resetGame();
                game.load(input);
                renderBoard();
            }
        }

        function copyFEN() {
            const fen = game.fen();
            const el = document.createElement('textarea');
            el.value = fen;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
        }

        function updateEvalChart() {
            const ctx = document.getElementById('evalChart');
            if (!ctx) return;

            if (!evalChart) {
                evalChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: evalHistory.map((_, i) => i),
                        datasets: [{
                            data: evalHistory,
                            borderColor: '#81b64c',
                            backgroundColor: 'rgba(129, 182, 76, 0.1)',
                            borderWidth: 2,
                            tension: 0.3,
                            fill: true
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            x: { display: false },
                            y: { grid: { color: 'rgba(255,255,255,0.05)' } }
                        }
                    }
                });
            } else {
                evalChart.data.labels = evalHistory.map((_, i) => i);
                evalChart.data.datasets[0].data = evalHistory;
                evalChart.update();
            }
        }

        // Event Attachments
        document.getElementById('undoBtn').addEventListener('click', undoMove);
        document.getElementById('resetBoardBtn').addEventListener('click', resetGame);
        document.getElementById('newGameBtn').addEventListener('click', resetGame);
        document.getElementById('startAiBtn').addEventListener('click', () => {
            gameMode = 'ai';
            resetGame();
        });
        document.getElementById('startPassPlayBtn').addEventListener('click', () => {
            gameMode = 'pvp';
            resetGame();
        });
        document.getElementById('flipBoardBtn').addEventListener('click', () => {
            isFlipped = !isFlipped;
            renderBoard();
        });

        document.getElementById('timeControlSelect').addEventListener('change', () => {
            resetGame();
        });

        document.getElementById('toggleSoundBtn').addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('soundIcon');
            icon.className = soundEnabled ? 'fa-solid fa-volume-high w-4 text-center' : 'fa-solid fa-volume-xmark w-4 text-center text-slate-500';
        });

        document.getElementById('quickEloSelect').addEventListener('change', (e) => {
            currentElo = parseInt(e.target.value);
            document.getElementById('activeEloLabel').textContent = `${currentElo} ELO`;
            document.getElementById('blackEloBadge').textContent = currentElo;
            document.getElementById('blackPlayerName').textContent = `Bot (${currentElo})`;
        });

        // Tab Navigation
        const tabLobbyBtn = document.getElementById('tabLobbyBtn');
        const tabChatBtn = document.getElementById('tabChatBtn');
        const tabReviewBtn = document.getElementById('tabReviewBtn');
        const lobbyTab = document.getElementById('lobbyTab');
        const chatTab = document.getElementById('chatTab');
        const reviewTab = document.getElementById('reviewTab');

        function activateTab(activeBtn, activeContent) {
            [tabLobbyBtn, tabChatBtn, tabReviewBtn].forEach(b => {
                b.classList.remove('bg-[#262421]', 'text-white', 'border', 'border-white/10');
                b.classList.add('text-slate-400');
            });
            [lobbyTab, chatTab, reviewTab].forEach(c => c.classList.add('hidden'));

            activeBtn.classList.add('bg-[#262421]', 'text-white', 'border', 'border-white/10');
            activeBtn.classList.remove('text-slate-400');
            activeContent.classList.remove('hidden');
        }

        tabLobbyBtn.addEventListener('click', () => activateTab(tabLobbyBtn, lobbyTab));
        tabChatBtn.addEventListener('click', () => activateTab(tabChatBtn, chatTab));
        tabReviewBtn.addEventListener('click', () => {
            activateTab(tabReviewBtn, reviewTab);
            setTimeout(updateEvalChart, 100);
        });

        window.onload = function() {
            renderBoard();
            applyTimeControl();
        };
    </script>
</body>
</html>
